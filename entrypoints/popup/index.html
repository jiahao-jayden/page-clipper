<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>剪藏到 Obsidian</title>
    <style>
      :root {
        --fg: #18181b;
        --fg-muted: #6b7280;
        --border: #e5e7eb;
        --bg: #ffffff;
        --bg-subtle: #f9fafb;
        --accent: #2563eb;
        --accent-fg: #ffffff;
        --ok: #15803d;
        --err: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        width: 420px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      h1 { font-size: 14px; font-weight: 600; margin: 0; }
      .platform {
        font-size: 11px;
        color: var(--fg-muted);
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: .04em;
        margin: 0 0 6px;
      }
      #preview {
        margin: 0 0 12px;
        padding: 10px 12px;
        height: 240px;
        overflow: auto;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 8px;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--fg);
      }
      #preview.empty { color: var(--fg-muted); font-family: inherit; }
      textarea {
        width: 100%;
        height: 56px;
        resize: vertical;
        padding: 8px 10px;
        margin-bottom: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
      }
      textarea:focus, #preview:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .actions { display: flex; gap: 8px; }
      button {
        flex: 1;
        padding: 9px 12px;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background .12s, border-color .12s, opacity .12s;
      }
      button:disabled { opacity: .5; cursor: default; }
      .btn-primary { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
      .btn-primary:not(:disabled):hover { background: #1d4ed8; }
      .btn-secondary { border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
      .btn-secondary:not(:disabled):hover { background: var(--bg-subtle); }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 16px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .ok { color: var(--ok); }
      .err { color: var(--err); }
      .muted { color: var(--fg-muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>剪藏到 Obsidian</h1>
      <span class="platform" id="platform" hidden></span>
    </header>

    <p class="label">Markdown 预览</p>
    <div id="preview" class="empty" tabindex="0">正在抽取页面内容…</div>

    <p class="label">备注</p>
    <textarea id="note" placeholder="备注（可选，会写入 frontmatter）"></textarea>

    <div class="actions">
      <button id="clip" class="btn-primary" disabled>剪藏</button>
      <button id="copy" class="btn-secondary" disabled>复制 Markdown</button>
    </div>

    <div id="status"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
